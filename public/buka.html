<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF5F8">
<title>Monaplan</title>
<!--
  Halaman pembuka PWA (start_url di manifest). Statis dan disimpan service worker, jadi tampil seketika
  walau server sedang lambat. Menampilkan splash yang sama dengan components/app/splash.tsx lalu pindah ke /mulai;
  peramban menahan tampilan ini sampai halaman tujuan siap, sehingga tidak ada layar hitam.
  Penanda sesi mp-splash bernilai "buka:<waktu>" agar splash halaman tujuan melanjutkan tampilan ini, bukan mengulang (lib/splash-script.ts).
-->
<style>
  html, body { margin: 0; height: 100%; background: #FBF5F8; }
  html.dark, html.dark body { background: #130E11; }
  /* Pusat logo tepat di tengah layar, sama dengan splash aplikasi (globals.css .mp-splash-center) dan gambar pembuka iPhone */
  .c { position: fixed; left: 0; right: 0; top: calc(var(--mp-splash-y, 50%) - 44px); display: flex; flex-direction: column; align-items: center; }
  .logo { width: 88px; height: 88px; overflow: visible; filter: drop-shadow(0 12px 24px rgba(74, 29, 54, 0.22)); }
  /* Tempat nama: tingginya sama (30px x 1.2) agar bar sejajar; namanya muncul di splash aplikasi dengan huruf aslinya */
  .name { margin: 18px 0 0; height: 36px; }
  .bar { margin-top: 22px; width: 148px; height: 4px; border-radius: 999px; background: #EDD1DF; overflow: hidden; }
  html.dark .bar { background: #3E1A2D; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: #8C3A63; transform-origin: left center; transform: scaleX(0.72); }
  html.dark .bar > span { background: #D9A3BE; }
  @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(0.72); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(0.98); } 45% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: no-preference) {
    /* Sama dengan mp-splash-load di globals.css; splash aplikasi meneruskan dari posisi ini */
    .bar > span { animation: load 2600ms cubic-bezier(0.25, 0.6, 0.3, 1) 300ms both; }
    .heart { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
  }
</style>
<script>
  (function () {
    try {
      var t = localStorage.getItem("mp-theme") || "light";
      if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      sessionStorage.setItem("mp-splash", "buka:" + Date.now());
      // Pusat layar penuh dalam koordinat halaman (area halaman dimulai di bawah status bar), sama dengan gambar pembuka iPhone
      var y=innerHeight-screen.height/2;if(y>120&&y<innerHeight-120)document.documentElement.style.setProperty("--mp-splash-y",y+"px");
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div class="c" aria-hidden="true">
    <svg viewBox="0 0 48 48" class="logo">
      <defs><linearGradient id="g" x1="6" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B8638D"/><stop offset="1" stop-color="#4A1D36"/></linearGradient></defs>
      <rect width="48" height="48" rx="13.5" fill="url(#g)"/>
      <path d="M13 36V20.2a3.3 3.3 0 0 1 5.7-2.3L24 24.2l5.3-6.3A3.3 3.3 0 0 1 35 20.2V36" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="heart" d="M24 17.6c-3.9-2.5-5.7-4.4-5.7-6.6a3.1 3.1 0 0 1 5.7-1.7 3.1 3.1 0 0 1 5.7 1.7c0 2.2-1.8 4.1-5.7 6.6z" fill="#F3C969"/>
    </svg>
    <div class="name"></div>
    <div class="bar"><span></span></div>
  </div>
  <script>
    // Beri satu bingkai agar splash sempat tergambar, lalu pindah tanpa menambah riwayat
    requestAnimationFrame(function () { setTimeout(function () { location.replace("/mulai"); }, 30); });
  </script>
  <noscript><a href="/mulai">Buka Monaplan</a></noscript>
</body>
</html>
