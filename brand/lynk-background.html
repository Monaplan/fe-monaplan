<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Background Lynk.id 1920x1080</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  /* Terang dan lembut supaya logo, banner gelap, dan tombol di halaman Lynk.id tetap jelas.
     Tampilan HP hanya menampilkan bagian tengah (sekitar x 650–1270):
     di sana hanya ada pola tipis; motif yang lebih jelas ada di sisi kiri dan kanan (desktop). */
  body {
    position: relative;
    background:
      radial-gradient(900px 700px at 0% 0%, rgba(198, 124, 159, .26), transparent 65%),
      radial-gradient(900px 700px at 100% 100%, rgba(140, 58, 99, .20), transparent 65%),
      linear-gradient(180deg, #FBF5F8 0%, #F6E8EF 100%);
  }
  svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Pola tipis di seluruh bidang: hati kecil, belah ketupat, dan titik, berselang-seling -->
    <pattern id="pat" width="160" height="160" patternUnits="userSpaceOnUse">
      <g fill="#8C3A63">
        <path opacity=".10" transform="translate(40 34) scale(1.15) translate(-24 -12)" d="M24 17.6c-3.9-2.5-5.7-4.4-5.7-6.6a3.1 3.1 0 0 1 5.7-1.7 3.1 3.1 0 0 1 5.7 1.7c0 2.2-1.8 4.1-5.7 6.6z"/>
        <path opacity=".10" transform="translate(120 114) scale(1.15) translate(-24 -12)" d="M24 17.6c-3.9-2.5-5.7-4.4-5.7-6.6a3.1 3.1 0 0 1 5.7-1.7 3.1 3.1 0 0 1 5.7 1.7c0 2.2-1.8 4.1-5.7 6.6z"/>
        <rect opacity=".09" x="116" y="30" width="9" height="9" transform="rotate(45 120.5 34.5)"/>
        <rect opacity=".09" x="36" y="110" width="9" height="9" transform="rotate(45 40.5 114.5)"/>
        <circle opacity=".08" cx="80" cy="80" r="2.6"/>
        <circle opacity=".08" cx="0" cy="0" r="2.6"/><circle opacity=".08" cx="160" cy="0" r="2.6"/>
        <circle opacity=".08" cx="0" cy="160" r="2.6"/><circle opacity=".08" cx="160" cy="160" r="2.6"/>
      </g>
    </pattern>

    <!-- Ranting melengkung dengan daun berisi lembut, berselang-seling (kotak 200x200) -->
    <g id="branch">
      <path d="M-4 14C46 20 96 50 150 126" fill="none" stroke="#8C3A63" stroke-width="1.4" stroke-linecap="round"/>
      <g fill="#8C3A63" fill-opacity=".55" stroke="none">
      <path transform="translate(22 17) rotate(-62) scale(1.1)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(30 26) rotate(70) scale(0.9)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(50 28) rotate(-52) scale(1.15)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(60 40) rotate(62) scale(1)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(82 46) rotate(-44) scale(1.1)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(90 62) rotate(56) scale(0.95)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(112 74) rotate(-34) scale(1)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(118 92) rotate(48) scale(0.9)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(136 104) rotate(-26) scale(0.85)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      <path transform="translate(142 120) rotate(40) scale(0.75)" d="M0 0C7 -8 7 -19 0 -30C-7 -19 -7 -8 0 0z"/>
      </g>
    </g>

    <!-- Dua cincin saling bertaut -->
    <g id="rings" fill="none" stroke="#8C3A63" stroke-width="2.2">
      <circle cx="-34" cy="0" r="58"/><circle cx="34" cy="0" r="58"/>
    </g>
  </defs>

  <!-- cincin besar di sudut -->
  <g fill="none" stroke="#8C3A63">
    <circle cx="-90" cy="170" r="550" stroke-opacity=".10" stroke-width="2"/>
    <circle cx="-70" cy="170" r="350" stroke-opacity=".07" stroke-width="2"/>
    <circle cx="2010" cy="920" r="550" stroke-opacity=".10" stroke-width="2"/>
    <circle cx="1990" cy="920" r="350" stroke-opacity=".07" stroke-width="2"/>
  </g>

  <!-- pola tipis di seluruh bidang -->
  <rect width="1920" height="1080" fill="url(#pat)"/>

  <!-- ranting di pojok kiri atas dan kanan bawah -->
  <use href="#branch" transform="translate(10 10) scale(2.9)" opacity=".24"/>
  <use href="#branch" transform="translate(1910 1070) rotate(180) scale(2.9)" opacity=".24"/>

  <!-- cincin pernikahan di kanan atas dan kiri bawah -->
  <use href="#rings" transform="translate(1640 190) rotate(-18)" opacity=".16"/>
  <use href="#rings" transform="translate(280 890) rotate(-18) scale(.85)" opacity=".16"/>
</svg>
</body>
</html>
